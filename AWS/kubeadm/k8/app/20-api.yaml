# Logic tier. Answers with its identity at "/", and proxies "/db/..." to the
# db Service by its full DNS name. nginx resolves that name through CoreDNS
# once, at startup, then talks to the (stable) ClusterIP.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-conf
  namespace: three-tier
data:
  default.conf: |
    server {
      listen 9000;
      location / {
        return 200 "[api] pod $hostname - logic tier here\n";
      }
      location /db/ {
        proxy_pass http://db.three-tier.svc.cluster.local/;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: three-tier
  labels:
    app: api
    tier: logic
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        tier: logic
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /
              port: 9000
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: conf
          configMap:
            name: api-conf
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: three-tier
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: 9000
