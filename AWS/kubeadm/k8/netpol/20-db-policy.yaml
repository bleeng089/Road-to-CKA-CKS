# db accepts connections only from api pods, and only on its real container
# port. NetworkPolicy ports are POD ports (targetPort 9000), never the
# Service port (80) — policies are enforced after kube-proxy's DNAT.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-allow-from-api
  namespace: three-tier
spec:
  podSelector:
    matchLabels:
      app: db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 9000
