[pytest]
# Run from AWS/kubeadm/k8/webshop/:  python -m pytest
pythonpath = src
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    ignore::DeprecationWarning:opentelemetry.*
markers =
    integration: needs PostgreSQL and RabbitMQ (set WEBSHOP_TEST_PGHOST / WEBSHOP_TEST_AMQP_HOST)
