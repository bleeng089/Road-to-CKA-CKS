# Same Service name as in app/30-frontend.yaml — applying this converts the
# existing frontend Service from ClusterIP to NodePort in place. The pinned
# nodePort keeps the lesson's commands predictable (default range 30000-32767).
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: three-tier
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
