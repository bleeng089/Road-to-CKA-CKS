{{/*
Generated credentials for the bundled PostgreSQL and RabbitMQ. An existing
Secret is reused on upgrade (lookup), so the password the database was
initialised with never changes underneath it. With existingSecret set, the
chart creates nothing and expects key "password" in that Secret.
*/}}
{{- range $c := list (dict "name" "postgresql" "enabled" .Values.postgresql.enabled "existing" .Values.postgresql.existingSecret) (dict "name" "rabbitmq" "enabled" .Values.rabbitmq.enabled "existing" .Values.rabbitmq.existingSecret) }}
{{- if and $c.enabled (not $c.existing) }}
{{- $secretName := printf "%s-%s" $.Release.Name $c.name }}
{{- $prev := lookup "v1" "Secret" $.Release.Namespace $secretName }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "webshop.labels" (dict "root" $ "component" $c.name) | nindent 4 }}
  annotations:
    # Uninstalling must not destroy the only copy of a password that a
    # retained data volume was initialised with.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $prev $prev.data $prev.data.password }}
  password: {{ $prev.data.password }}
  {{- else }}
  password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
{{- if .Values.grafana.enabled }}
{{- /*
Grafana's admin credentials, owned here rather than by the Grafana chart:
Grafana stores the admin password in its (persistent) database on first
start, so the Secret must outlive `helm uninstall` exactly as long as that
volume does - otherwise a reinstall shows a password that no longer works.
*/}}
{{- $gname := printf "%s-grafana-admin" .Release.Name }}
{{- $gprev := lookup "v1" "Secret" .Release.Namespace $gname }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $gname }}
  labels:
    {{- include "webshop.labels" (dict "root" . "component" "grafana") | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  admin-user: {{ "admin" | b64enc }}
  {{- if and $gprev $gprev.data (index $gprev.data "admin-password") }}
  admin-password: {{ index $gprev.data "admin-password" }}
  {{- else }}
  admin-password: {{ randAlphaNum 24 | b64enc }}
  {{- end }}
{{- end }}

